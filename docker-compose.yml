services:
  scdxitv:
    build: .
    container_name: scdxiptv
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /volume2/docker/scdxitv/output:/app/output
      - /volume2/docker/scdxitv/config:/app/config
      - /volume2/docker/scdxitv/log:/app/log
      - /volume2/docker/scdxitv/logo:/app/logo
